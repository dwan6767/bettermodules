<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modules — BetterModules</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root { --bg: #0d0c10; --panel: #17151c; --text: #ffffff; --muted: #8c8994; --accent: #f5c211; --border: #2d2636; --logo-blend: screen; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { max-width: 800px; margin: 0 auto; padding: 24px 20px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; }
    header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
    .logo-img { height: 84px; width: auto; mix-blend-mode: var(--logo-blend); filter: contrast(1.15); }
    nav a { color: var(--text); text-decoration: none; font-size: 14px; margin-left: 20px; font-weight: 600; }
    nav a.active { color: var(--accent); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 48px; }
    .module-card { background: var(--panel); border: 1px solid var(--border); padding: 24px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; }
    .module-card h3 { font-size: 18px; margin-bottom: 8px; }
    .module-card p { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
    .module-meta { display: flex; align-items: center; justify-content: space-between; font-family: monospace; font-size: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
    .status-tag { color: var(--accent); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <a href="index.html"><img src="bm.png" alt="BetterModules Logo" class="logo-img"></a>
    <nav>
      <a href="modules.html" class="active">Modules</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="section-head">
    <h2>Crafted Modules</h2>
    <span style="font-family: monospace; font-size: 12px; color: var(--muted);">[ HARDWARE BENCH ]</span>
  </div>

  <div class="grid" id="moduleContainer">
    <p style="color: var(--muted);">Loading modules...</p>
  </div>

  <script>
      const SUPABASE_URL = "https://riyftzdtprskxvrelkkw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_90cLnhtygsLWuosJBvD2gw_RkfpC8g7";
    async function fetchModules() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/modules?select=*`, {
          headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        const container = document.getElementById("moduleContainer");
        if (!data || data.length === 0) {
          container.innerHTML = "<p style='color: var(--muted);'>No modules published yet.</p>";
          return;
        }
        container.innerHTML = data.map(mod => `
          <div class="module-card">
            <div>
              <h3>${mod.title}</h3>
              <p>${mod.description}</p>
            </div>
            <div class="module-meta">
              <span>${mod.rev || 'REV 1.0'}</span>
              <a href="${mod.schematic_url || '#'}" class="status-tag">▶ VIEW SCHEMATIC</a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById("moduleContainer").innerHTML = "<p style='color: var(--muted);'>Failed to load modules.</p>";
      }
    }
    fetchModules();
  </script>
</body>
</html>
